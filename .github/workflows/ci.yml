name: TypeScript CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AI repair script syntax
        run: node --check .github/scripts/ai-fix.mjs
      - name: Install dependencies
        run: npm install
      - name: Build TypeScript
        run: npm run build
