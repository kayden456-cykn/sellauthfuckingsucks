name: AI Build Repair

on:
  workflow_run:
    workflows: ["TypeScript CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ai-repair-${{ github.repository }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'failure' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the failed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect failed build logs
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$FAILED_RUN_ID" --log-failed > /tmp/failed-build.log || true

      - name: Initialize manual run log
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Manual repair requested. Inspect source and attempt a safe build-only repair." > /tmp/failed-build.log

      - name: Generate, apply, and verify a source-only patch
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node .github/scripts/ai-fix.mjs /tmp/failed-build.log

      - name: Commit and push only a verified source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No verified source changes to commit."
            exit 0
          fi
          git commit -m "fix: apply verified AI build repair"
          git push origin HEAD:main
